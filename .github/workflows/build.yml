name: Build Pro Audio EQ RTA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          unzip ProAudioEQ_RTA_Android_Source.zip -d /tmp/project
          cp -R /tmp/project/ProAudioEQ_RTA_Android/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProAudioEQ_RTA_APK
          path: app/build/outputs/apk/debug/app-debug.apk
